# Netlify Configuration for Atelier Lumière Melbourne

[build]
  base = "client"
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Route API calls to Netlify Serverless Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback for React client router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
